<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('gif-texture', {
        schema: { src: { type: 'string' } },
        init: async function () {
          var data = await (await fetch(this.data.src)).arrayBuffer();
          var decoder = new ImageDecoder({ data: data, type: 'image/gif' });
          await decoder.tracks.ready;
          var count = decoder.tracks.selectedTrack.frameCount;
          this.frames = [];
          for (var i = 0; i < count; i++) {
            var result = await decoder.decode({ frameIndex: i });
            var f = result.image;
            this.frames.push({ bitmap: await createImageBitmap(f), ms: (f.duration || 100000) / 1000 });
            f.close();
          }
          this.canvas = document.createElement('canvas');
          this.canvas.width = this.frames[0].bitmap.width;
          this.canvas.height = this.frames[0].bitmap.height;
          this.ctx = this.canvas.getContext('2d');
          this.texture = new THREE.CanvasTexture(this.canvas);
          var mesh = this.el.getObject3D('mesh');
          mesh.material.map = this.texture;
          mesh.material.needsUpdate = true;
          this.index = -1; this.elapsed = 0;
        },
        tick: function (time, delta) {
          if (!this.texture) return;
          this.elapsed += delta;
          var frame = this.frames[Math.max(this.index, 0)];
          if (this.index < 0 || this.elapsed >= frame.ms) {
            this.elapsed = 0;
            this.index = (this.index + 1) % this.frames.length;
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.drawImage(this.frames[this.index].bitmap, 0, 0);
            this.texture.needsUpdate = true;
          }
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-marker type="pattern" url="pattern-2-AR.patt">
        <a-plane position="0 0.5 0" width="1" height="1" rotation="-90 0 0" gif-texture="src: my.gif"></a-plane>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
